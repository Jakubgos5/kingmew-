<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mew City 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--card:#fff;--ink:#14283f;--mute:#5b6f7f;--line:#c9d6d3;--sea:#1f5a7a;--gold:#a97c0e;--red:#c4402a;--btn:#14283f;--btnt:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2b;--card:#172a3f;--ink:#e8eff3;--mute:#9db0be;--line:#2b4259;--sea:#6bb4d6;--gold:#e0b72f;--red:#ff7a62;--btn:#e0b72f;--btnt:#0f1c2b}}
:root[data-theme="dark"]{--bg:#0f1c2b;--card:#172a3f;--ink:#e8eff3;--mute:#9db0be;--line:#2b4259;--sea:#6bb4d6;--gold:#e0b72f;--red:#ff7a62;--btn:#e0b72f;--btnt:#0f1c2b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 30px/1.1 Fraunces,Georgia,serif;margin:8px 0 2px}
h2{font:500 19px/1.2 Fraunces,Georgia,serif;margin:0 0 10px}
.sub{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.stat{text-align:center;border-right:1px solid var(--line)}.stat:nth-child(4n),.stat:last-child{border:0}
.stat b{display:block;font:700 19px Fraunces,Georgia,serif}.stat span{font-size:13px;color:var(--mute)}
button{font:inherit;font-weight:500;background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:not-allowed}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button:focus-visible,select:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row small{display:block;color:var(--mute);font-size:13px}
select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px}
.big{width:100%;font-size:18px;padding:14px}
ul{list-style:none;margin:0;padding:0}li{padding:5px 0;border-top:1px solid var(--line);font-size:15px}li:first-child{border:0;font-weight:500}
.bad{color:var(--red)}
svg.map{width:100%;height:auto;display:block;border-radius:10px}
.plot{cursor:pointer}.plot:focus-visible{outline:2px solid #a97c0e}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.pick button{text-align:left;padding:8px 10px;font-size:14px}.pick small{display:block;font-weight:400;color:var(--mute);font-size:12px}
#cap{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:50;display:none;text-align:center;max-width:92vw}#cap div{padding:8px 18px;border-radius:10px;margin-bottom:6px;font:700 18px Fraunces,Georgia,serif;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.35)}#cap .cw{background:#c4402a}#cap .cg{background:#a97c0e}
</style></head><body><div id="cap" role="status"></div><main>
<h1>Mew City</h1>
<p class="sub" id="sub"></p>
<div class="card stats" id="stats"></div>
<button class="big" id="next">Następny dzień</button>
<div class="card" style="margin-top:12px"><h2>Mapa miasta</h2><div id="map" style="height:440px;border-radius:10px;overflow:hidden;touch-action:none;cursor:grab"></div><div id="panel" style="margin-top:10px"></div></div>
<div class="card"><h2>Flota i wojna</h2><div id="fleet"></div></div>
<div class="card"><h2>Wyścig o Imperium</h2><div id="race"></div></div>
<div class="card"><h2>Badania</h2><div id="tech"></div></div>
<div class="card"><h2>Mewy</h2><div id="gulls"></div>
<p style="margin:10px 0 0"><button class="ghost" id="rec">Zwerbuj mewę (5 ryb)</button></p></div>

<div class="card"><h2>Kronika</h2><ul id="log"></ul></div>
<p><button class="ghost" id="reset">Zacznij od nowa</button></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const ROLES={fish:"Rybak",build:"Budowniczy",guard:"Strażnik",scout:"Zwiadowca",mage:"Mag",king:"Mewi król"};
const NAMES=["Pióro","Sztorm","Kleks","Mgiełka","Piana","Kotwica","Szkwał","Bryza","Cumulus","Muszelka","Wydma","Fala","Rafa","Jantar","Cypel","Ster"];
const BLD={nest:{n:"Gniazdo",d:"+3 miejsca w kolonii",base:10},dock:{n:"Port rybny",d:"+1 ryba na rybaka dziennie",base:15,coast:1},tower:{n:"Wieża strażnicza",d:"+3 obrony przed najazdem",base:20},castle:{n:"Gniazdo zamkowe",d:"+6 miejsc w kolonii, tron dla mewiego króla (złoto)",base:40},barracks:{n:"Koszary",d:"+1 obrony za każdego strażnika",base:25},smoke:{n:"Wędzarnia",d:"+3 ryby dziennie",base:20},lab:{n:"Akademia badań",d:"+2 pkt badań dziennie",base:30},mtower:{n:"Wieża magów",d:"+2 miejsca dla magów",base:40,need:"magic"},house:{n:"Domek mew",d:"+2 miejsca w kolonii",base:8},market:{n:"Targ",d:"+1 muszla dziennie",base:30},light:{n:"Latarnia",d:"+2 obrony, radar okrętów wroga z daleka, tylko nad wodą",base:25,coast:1},park:{n:"Park miejski",d:"+2 prestiżu",base:20},quarry:{n:"Kamieniołom",d:"+2 kamienie dziennie, szansa na bursztyn",base:25},forge:{n:"Kuźnia bursztynu",d:"kuje narzędzia: drewniane, kamienne, bursztynowe",base:35},campfire:{n:"Ognisko",d:"mewy robią same dziobami, za darmo",base:0},bench:{n:"Ławka",d:"mewy robią same dziobami, za darmo",base:0},path:{n:"Polna dróżka",d:"mewy robią same dziobami, za darmo",base:0},marina:{n:"Przystań",d:"+2 ryby dziennie, +2 limit okrętów",base:20,water:1},port:{n:"Port morski",d:"+2 ryby i +1 muszla dziennie",base:35,water:1},shipyard:{n:"Stocznia",d:"+3 limit okrętów, mocniejsze okręty",base:40,water:1},sawmill:{n:"Tartak",d:"+2 patyki dziennie",base:18},wall:{n:"Mur obronny",d:"+2 obrony",base:10}};
const KEY="krolestwo-mew-v6";
const MAXL=3;
const TECH={net:{n:"Sieci rybackie",d:"+1 ryba na rybaka",c:6},arch:{n:"Architektura klifowa",d:"+2 miejsca w kolonii",c:8},arms:{n:"Stalowe dzioby",d:"+1 obrony za strażnika",c:10},magic:{n:"Sztuka magii",d:"odblokowuje Wieżę magów, magowie +2 obrony",c:12}};
const defense=()=>S.gulls.reduce((a,g)=>a+(g.armor?2:0),0)+cnt("guard")*(2+(S.tech.arms?1:0)+lv("barracks"))+lv("tower")*3+lv("light")*2+lv("wall")*2+cnt("mage")*(2+(S.tech.magic?2:0));
const mageCap=()=>lv("mtower")*2;
function drawTech(){document.getElementById("tech").innerHTML=(lv("lab")+cnt("mage")?'':'<p class="sub" style="margin:0 0 8px">Wznieś Akademię badań albo zatrudnij maga, aby zdobywać punkty.</p>')+Object.keys(TECH).map(k=>{const t=TECH[k];return '<div class="row"><span>'+t.n+'<small>'+t.d+'</small></span>'+(S.tech[k]?'<b>Zbadano</b>':'<button data-t="'+k+'"'+(S.rp<t.c?' disabled':'')+'>Zbadaj · '+t.c+' pkt</button>')+'</div>'}).join('')}
const W=28,H=18,T=35,N=W*H;
let SEL=null;
const lv=t=>S.plots.reduce((a,p)=>a+(p&&p.type===t?p.lvl:0),0);
const LAND0=()=>Array.from({length:N},(_,i)=>{const c=i%W,r=Math.floor(i/W);return +(((c-13.5)/7)**2+((r-8.5)/5)**2<=1)});
const prestige=()=>S.plots.reduce((a,p)=>a+(p&&BLD[p.type].base?p.lvl:0),0)+2*lv("park")+Math.floor(S.land.filter(Boolean).length/15)+(S.bonus||0);
const rank=()=>{const p=prestige();return p<8?"Osada":p<20?"Miasteczko":p<40?"Miasto":p<70?"Metropolia":"Imperium Mew City"};
const nb=i=>{const c=i%W,r=Math.floor(i/W);return[[c-1,r],[c+1,r],[c,r-1],[c,r+1]].map(([a,b])=>a<0||b<0||a>=W||b>=H?-1:b*W+a)};
const coast=i=>nb(i).some(j=>j<0||!S.land[j]);
const reach=i=>nb(i).some(j=>j>=0&&S.land[j]);
const landCost=()=>3+Math.floor(S.land.filter(Boolean).length/12);
function drawMap(){
 sync3d();
 const pn=document.getElementById("panel");
 if(SEL===null){pn.innerHTML='<p class="sub" style="margin:0">Przeciągnij, aby obrócić widok, przybliż kółkiem lub dwoma palcami. Dotknij pola: wolnego, aby wznieść budynek, albo wody przy brzegu, aby zdobyć ląd.</p>';return}
 const b=S.plots[SEL];
 if(S.sharks.some(q=>q.i===SEL)){pn.innerHTML='<div class="row"><span><b>Czerwony rekin</b><small>Zjada ryby przy brzegu. Wolni strażnicy: '+S.patrol+'</small></span><button data-s="1"'+(S.patrol<1?' disabled':'')+'>Wypędź · '+Math.round(expelP()*100)+'%</button></div>';return}
 if(!S.land[SEL]&&!b){pn.innerHTML=reach(SEL)?waterUI()+'<div class="row"><span><b>Woda przy brzegu</b><small>Powiększ miasto o nowy ląd</small></span><button data-l="1"'+(S.twigs<landCost()?' disabled':'')+'>Zdobądź ląd · '+landCost()+'</button></div>':'<p class="sub" style="margin:0">To pole jest za daleko od lądu. Najpierw zdobądź pola przy brzegu.</p>';return}
 if(!b){pn.innerHTML='<b>Wolne pole</b><div class="pick">'+Object.keys(BLD).filter(k=>!BLD[k].water).map(k=>{const d=BLD[k],lock=d.need&&!S.tech[d.need],wet=d.coast&&!coast(SEL);return '<button class="ghost" data-n="'+k+'"'+(lock||wet||S.twigs<cost(k,0)?' disabled':'')+'>'+d.n+' · '+cost(k,0)+'<small>'+(lock?'wymaga badań':wet?'tylko nad wodą':d.d)+'</small></button>'}).join('')+'</div>';return}
 const c=cost(b.type,b.lvl),max=b.lvl>=MAXL;
 pn.innerHTML=(b.type==="shipyard"?shipUI():b.type==="forge"?forgeUI():b.type==="castle"?castleUI():"")+'<div class="row"><span><b>'+BLD[b.type].n+', poziom '+b.lvl+'</b><small>'+BLD[b.type].d+' (za każdy poziom)</small></span><button data-u="1"'+(max||S.twigs<c?' disabled':'')+'>'+(max?'Maks. poziom':'Ulepsz · '+c)+'</button></div><p style="margin:8px 0 0"><button class="ghost" data-d="1">Rozbierz (zwrot '+Math.floor(BLD[b.type].base*b.lvl/2)+')</button></p>';
}
const GOAL=60;
const BOTI=[];
const sea=i=>!S.land[i]&&!S.plots[i]&&!BOTI.includes(i);
const expelP=()=>Math.min(.95,.55+.1*lv("barracks")+.1*cnt("mage"));
const shark=(m,n)=>`<g style="pointer-events:none"><ellipse cx="${m}" cy="${n+2}" rx="12" ry="5" fill="#d6372b"/><path d="M${m-2} ${n-2}L${m+2} ${n-11}L${m+6} ${n-2}z" fill="#a8231a"/><path d="M${m-12} ${n+2}l-6-5v10z" fill="#d6372b"/><circle cx="${m+7}" cy="${n+1}" r="1.5" fill="#fff"/></g>`;
function sharkTurn(){
 let pt=S.patrol;
 S.sharks=S.sharks.filter(q=>{if(pt>0){pt--;if(rnd()<expelP()){say("strażnicy wypędzili czerwonego rekina.");return false}}return true});
 S.sharks.forEach(q=>{
  if(reach(q.i)&&rnd()<.5){const l=Math.min(S.fish,2+Math.floor(S.day/4));if(l){S.fish-=l;say("czerwony rekin zjadł "+l+" ryb.");eatAnim(q,Math.min(l,4))}}
  const o=nb(q.i).filter(j=>j>=0&&sea(j)&&!S.sharks.some(z=>z.i===j));
  if(o.length){const d=j=>Math.abs(j%W-13.5)+Math.abs(Math.floor(j/W)-8.5);q.i=rnd()<.6?o.reduce((a,j)=>d(j)<d(a)?j:a):o[Math.floor(rnd()*o.length)]}
 });
 if(S.day>=30&&S.sharks.length<4&&rnd()<Math.min(.6,.25+S.day*.01)){const e=[];for(let i=0;i<N;i++){const c=i%W,r=Math.floor(i/W);if((c===0||r===0||c===W-1||r===H-1)&&sea(i)&&!S.sharks.some(z=>z.i===i))e.push(i)}if(e.length){S.sharks.push({i:e[Math.floor(rnd()*e.length)]});say("na wodach pojawił się czerwony rekin!")}}
 S.patrol=cnt("guard");
}
function advanceBots(){
 S.bots.forEach(b=>{if(b.out)return;b.p+=b.rate*(.5+rnd())});
 if(!S.winner){const all=[{n:"Ty",p:prestige()}].concat(S.bots.map(b=>({n:b.name,p:b.p}))).filter(x=>x.p>=GOAL).sort((a,b)=>b.p-a.p);
  if(all.length){S.winner=all[0].n;say(S.winner==="Ty"?"wygrywasz wyścig! Twoje miasto zostaje Imperium Mew City.":S.winner+" wygrywa wyścig o Imperium. Możesz grać dalej.")}}
}
function drawRace(){
 const all=[{name:"Twoje miasto",p:prestige(),me:1}].concat(S.bots.filter(b=>!b.out)).sort((a,b)=>b.p-a.p);
 document.getElementById("race").innerHTML='<p class="sub" style="margin:0 0 6px">Pierwsze miasto z prestiżem '+GOAL+' zostaje Imperium Mew City.</p>'+all.map(x=>'<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>'+(x.me?'<b>'+x.name+'</b>':x.name)+'</span><span>'+Math.floor(x.p)+' / '+GOAL+'</span></div><div style="height:8px;border-radius:4px;background:var(--line)"><div style="height:8px;border-radius:4px;width:'+Math.min(100,x.p/GOAL*100)+'%;background:'+(x.me?'var(--gold)':'var(--sea)')+'"></div></div></div>').join('');
}
let S;
const rnd=()=>Math.random();
const pick=()=>NAMES[Math.floor(rnd()*NAMES.length)];
const roles=Object.keys(ROLES);
function fresh(){return{fleet:{ind:0,mil:0},order:-1,nextRaid:40,bonus:0,stone:0,amber:0,arm:0,gold:0,tools:{w:0,s:0,a:0,p:0},recon:{},day:1,fish:20,twigs:10,shells:0,rp:0,tech:{},land:LAND0(),sharks:[],patrol:1,winner:"",bots:[{name:"Klan Sztormu",p:0,rate:1.2},{name:"Kolonia Piany",p:0,rate:1},{name:"Mewy z Zatoki",p:0,rate:.8}],plots:Array.from({length:N},(_,i)=>i===8*W+13?{type:"nest",lvl:1}:null),gulls:[0,1,2,3].map(i=>({name:pick(),role:roles[i]})),log:["Królestwo powstaje na skalistym klifie."]}}
function load(){try{const r=localStorage.getItem(KEY);S=r?JSON.parse(r):fresh()}catch(e){S=fresh()}S.fleet=S.fleet||{ind:0,mil:0};S.tools=S.tools||{w:0,s:0,a:0};S.arm=S.arm||0;S.gold=S.gold||0;S.tools.p=S.tools.p||0;S.stone=S.stone||0;S.amber=S.amber||0;S.recon=S.recon||{};if(S.order==null)S.order=-1;S.nextRaid=Math.max(40,Math.ceil(Math.max(S.nextRaid==null?0:S.nextRaid,S.day+1)/20)*20)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const cap=()=>2+lv("nest")*3+lv("castle")*6+lv("house")*2+(S.tech.arch?2:0);
const cnt=r=>S.gulls.filter(g=>g.role===r).length;
const cost=(k,l)=>BLD[k].base*(l+1);
function say(m){S.log.unshift("Dzień "+S.day+": "+m);S.log=S.log.slice(0,10)}
function next(){
  S.day++;
  if(S.day>=S.nextRaid){const n=window.launchRaid?launchRaid():0;S.nextRaid=(Math.floor(S.day/20)+1)*20;say(n?"najazd! Wróg wysyła "+n+" okrętów na Twoje miasto.":"wróg szykował najazd, ale nie ma jak wypłynąć.")}
  const f=cnt("fish")*(3+lv("dock")+(S.tech.net?1:0))+lv("smoke")*3+lv("marina")*2+lv("port")*2+S.fleet.ind*3+toolFish(),t=cnt("build")*2+lv("sawmill")*2+toolSum("build");
  S.fish+=f;S.twigs+=t;const kg=kingGold();S.gold+=kg;S.rp+=lv("lab")*2+cnt("mage")+S.gulls.filter(g=>g.role==="mage").reduce((a,g)=>a+Math.ceil((g.tool||0)/2),0);S.shells+=lv("market")+lv("port");S.stone+=lv("quarry")*2;if(rnd()<.2*lv("quarry"))S.amber++;S.gulls.filter(g=>g.role==="scout").forEach(g=>{if(rnd()<.3+.1*(g.tool||0))S.amber++});say("złowiono "+f+" ryb, zebrano "+t+" patyków."+(kg?" Król przyniósł "+kg+" złota.":""));
  S.gulls.filter(g=>g.role==="scout").forEach(g=>{if(rnd()<.3+.1*(g.tool||0)){S.shells++;say("zwiadowca znalazł muszlę-skarb.")}})
  if(S.day>=30&&rnd()<.35){
    const str=2+Math.floor(rnd()*7),def=defense();
    if(def>=str)say("odparto najazd rybitw (siła "+str+").");
    else{const l=Math.min(S.fish,str*2);S.fish-=l;say("najazd rybitw! Stracono "+l+" ryb (obrona "+def+", siła "+str+").")}
  }
  sharkTurn();advanceBots();
  const need=S.gulls.length;
  if(S.fish>=need)S.fish-=need;
  else{const d=Math.min(need-S.fish,S.gulls.length-1);S.fish=0;const lost=S.gulls.splice(-d,d).map(g=>g.name).join(", ");say("głód! Kolonię opuszczają: "+lost+".")}
  if(S.gulls.length<cap()&&S.fish>=S.gulls.length*2&&rnd()<.5){const n=pick();S.gulls.push({name:n,role:"fish"});say("z jaja wykluwa się nowa mewa: "+n+".")}
  save();draw();
}
function draw(){
  document.getElementById("sub").textContent=rank()+" · prestiż "+prestige()+" · dzień "+S.day+" · populacja "+S.gulls.length+" z "+cap()+" miejsc · obrona "+defense()+" · rekiny "+S.sharks.length+" · atak okrętów wroga za "+(S.nextRaid-S.day)+" dn.";
  document.getElementById("stats").innerHTML=[["Ryby",S.fish],["Patyki",S.twigs],["Muszle",S.shells],["Mewy",S.gulls.length],["Badania",S.rp],["Kamień",S.stone],["Bursztyn",S.amber],["Złoto",S.gold]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join("");
  document.getElementById("gulls").innerHTML='<p class="sub" style="margin:0 0 6px">Premie narzędzi (drewniane 1, kamienne 2, bursztynowe 3): strażnik dostaje włócznię na wieży, rybak +ryby dziennie, budowniczy +patyki i szybszą naprawę wież, zwiadowca +10% szansy na znaleziska za poziom, mag +punkty badań. Zbroja daje każdej mewie +2 obrony. Wykujesz je w Kuźni bursztynu.</p>'+S.gulls.map(gullRow).join("");
  drawMap();drawTech();drawRace();drawFleet();
  document.getElementById("log").innerHTML=S.log.map(l=>"<li>"+l+"</li>").join("");
  document.getElementById("rec").disabled=S.fish<5||S.gulls.length>=cap();
}
document.getElementById("next").onclick=next;
document.getElementById("rec").onclick=()=>{if(S.fish>=5&&S.gulls.length<cap()){S.fish-=5;const n=pick();S.gulls.push({name:n,role:"fish"});say("do królestwa dołącza "+n+".");save();draw()}};
document.getElementById("gulls").onchange=e=>{const t=e.target,d=t.dataset;
 if(d.i!==undefined)S.gulls[+d.i].role=t.value;
 else if(d.ti!==undefined){const g=S.gulls[+d.ti],v=+t.value;if(v&&toolFree(v)<1){draw();return}g.tool=v}
 else if(d.ai!==undefined){const g=S.gulls[+d.ai],v=+t.value;if(v&&!g.armor&&armFree()<1){draw();return}g.armor=v}
 else return;
 save();draw()};
document.getElementById("panel").onclick=e=>{const d=e.target.closest("button");if(!d||SEL===null)return;const k=d.dataset.n,b=S.plots[SEL];
 if(d.dataset.craft){const kd=d.dataset.craft,c={w:["twigs",4],s:["stone",4],a:["amber",3],r:["amber",5]}[kd];if(S[c[0]]<c[1])return;S[c[0]]-=c[1];if(kd==="r"){S.arm++;say("wykuto zbroję bursztynową.")}else{S.tools[kd]++;say("wykuto narzędzie "+{w:"drewniane",s:"kamienne",a:"bursztynowe"}[kd]+".")}}

 const to=[0,1,2,3,4].map(t=>'<option value="'+t+'"'+((g.tool||0)===t?" selected":"")+(t&&(g.tool||0)!==t&&toolFree(t)<1?" disabled":"")+'>'+TN[t]+(t?' ('+toolFree(t)+' wolne)':'')+'</option>').join("");
 const ar='<option value="0"'+(g.armor?'':' selected')+'>Bez zbroi</option><option value="1"'+(g.armor?' selected':'')+(!g.armor&&armFree()<1?' disabled':'')+'>Zbroja bursztynowa ('+armFree()+' wolne)</option>';
 return '<div class="row" style="flex-wrap:wrap"><span>'+g.name+'</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><select data-i="'+i+'" aria-label="Rola: '+g.name+'">'+ro+'</select><select data-ti="'+i+'" aria-label="Narzędzie: '+g.name+'">'+to+'</select><select data-ai="'+i+'" aria-label="Zbroja: '+g.name+'">'+ar+'</select></span></div>'}
const forgeUI=()=>{const t=S.tools,r=(n,k,txt,ok)=>'<div class="row"><span>'+n+'<small>'+txt+'</small></span><button data-craft="'+k+'"'+(ok?'':' disabled')+'>Wykuj</button></div>';return '<p class="sub" style="margin:0 0 4px">Narzędzia: drewniane '+t.w+' · kamienne '+t.s+' · bursztynowe '+t.a+' · ulepszone '+(t.p||0)+'. Złoto: '+S.gold+'. Zbroje: '+S.arm+'. Załóż je mewom w sekcji Mewy.</p>'+r('Narzędzie drewniane','w','4 patyki',S.twigs>=4)+r('Narzędzie kamienne','s','4 kamienie',S.stone>=4)+r('Narzędzie bursztynowe','a','3 bursztyny (przetop)',S.amber>=3)+r('Zbroja bursztynowa','r','5 bursztynów · +2 obrony noszącej mewie',S.amber>=5)+'<div class="row"><span>Ulepsz narzędzie bursztynowe<small>80 złota, zamienia wolne bursztynowe w ulepszone (wyższe premie)</small></span><button data-upg="1"'+(S.gold<80||toolFree(3)<1?' disabled':'')+'>Ulepsz · 80 zł</button></div>'};
function infoUI(){const R=window.RADAR,T=window.TWI||{n:0,g:0,hp:0,max:0};return '<div class="row"><span>Wieże strażnicze<small>'+T.n+' wież · strażnicy w wieżach: '+T.g+' · HP '+Math.round(T.hp)+'/'+Math.round(T.max)+' · włócznie: '+["brak","drewniane","kamienne","bursztynowe","ulepszone"][spearTier()]+'</small></span></div><div class="row"><span>Radar latarni<small>'+(R==null?'Wznieś latarnię, aby widzieć okręty wroga z daleka.':R.length?R.length+' okrętów wroga; najbliższy '+Math.round(R[0].d)+' j. od miasta, kadłub '+["","drewniany","kamienny","bursztynowy"][R[0].h]:'brak okrętów wroga w zasięgu')+'</small></span></div>'}
const fleetCap=()=>lv("shipyard")*3+lv("marina")*2;
const shipUI=()=>{const ok=S.fleet.ind+S.fleet.mil<fleetCap();return '<div class="row"><span>Okręt przemysłowy<small>+3 ryby dziennie · 30 HP</small></span><button data-ship="ind"'+(!ok||S.fish<50?' disabled':'')+'>50 ryb</button></div><div class="row"><span>Okręt wojskowy<small>HP '+(40+10*lv("shipyard"))+' · atak '+(5+2*lv("shipyard"))+'</small></span><button data-ship="mil"'+(!ok||S.fish<100?' disabled':'')+'>100 ryb</button></div>'};
const waterUI=()=>'<b>Budowle na wodzie</b><div class="pick">'+Object.keys(BLD).filter(k=>BLD[k].water).map(k=>{const d=BLD[k];return '<button class="ghost" data-n="'+k+'"'+(S.twigs<cost(k,0)||BOTI.includes(SEL)?' disabled':'')+'>'+d.n+' · '+cost(k,0)+'<small>'+d.d+'</small></button>'}).join('')+'</div>';
const bribeUI=()=>{const L=window.raidShips?raidShips():[];return '<div class="row"><span>Przekup okręt wroga<small>1000 złota, okręt zawraca do swojej bazy · masz '+S.gold+'</small></span></div>'+(L.length?L.map(s=>'<div class="row"><span>'+s.name+'<small>HP '+Math.round(s.hp)+'/'+Math.round(s.max)+'</small></span><button data-bribe="'+s.id+'"'+(S.gold<1000?' disabled':'')+'>Przekup · 1000</button></div>').join(''):'<p class="sub" style="margin:0 0 8px">Brak okrętów wroga w drodze.</p>')};
function drawFleet(){const f=S.fleet;document.getElementById("fleet").innerHTML='<p style="margin:0 0 8px"><b style="color:var(--red)">Atak okrętów wroga za '+(S.nextRaid-S.day)+' dn.</b></p>'+bribeUI()+'<p class="sub" style="margin:0 0 8px">Przemysłowe: <b>'+f.ind+'</b> (+3 ryby dziennie) · wojskowe: <b>'+f.mil+'</b> · limit '+(f.ind+f.mil)+'/'+fleetCap()+'. Okręty zwodujesz w stoczni (budowla na wodzie przy brzegu). Okręt wojskowy musi przez minutę stać przy wyspie wroga bez ataku, aby ją zająć.</p>'+infoUI()+'<div class="row"><span>Rozkaz floty<small>'+(S.order<0?'Obrona miasta':'Atak na: '+S.bots[S.order].name)+'</small></span><button class="ghost" data-o="-1">Obrona</button></div>'+S.bots.map((b,k)=>'<div class="row"><span>'+b.name+'<small>'+(b.out?'zajęta przez Ciebie':'prestiż '+Math.floor(b.p))+(S.recon&&S.recon[k]!=null?' · strażników: '+S.recon[k]:'')+(SCT[k]>0?' · zwiad w drodze '+Math.ceil(SCT[k])+'s':'')+'</small></span><span><button class="ghost" data-z="'+k+'"'+(b.out||SCT[k]>0||!cnt("scout")||!(S.fleet.ind+S.fleet.mil)?' disabled':'')+'>Zwiad</button> <button class="ghost" data-v="'+k+'">Podgląd</button> <button data-o="'+k+'"'+(b.out||!f.mil?' disabled':'')+'>Atak</button></span></div>').join('')+'<p style="margin:8px 0 0"><button class="ghost" data-v="-1">Widok miasta</button></p>'}
document.getElementById("fleet").onclick=e=>{const d=e.target.closest("button");if(!d)return;if(d.dataset.bribe!==undefined){if(window.bribeShip&&bribeShip(d.dataset.bribe)){save();draw()}}else if(d.dataset.o!==undefined){S.order=+d.dataset.o;save();draw()}else if(d.dataset.z!==undefined){SCT[+d.dataset.z]=45;draw()}else if(d.dataset.v!==undefined&&window.camTo)camTo(+d.dataset.v)};
document.getElementById("reset").onclick=()=>{S=fresh();SEL=null;if(window.resetZ)resetZ();save();draw()};
load();draw();
</script></body></html>
